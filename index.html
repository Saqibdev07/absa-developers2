<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebTeam Manager</title>
<meta name="description" content="WebTeam referral and commission management">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d13;--bg-2:#0d1119;
  --surface:#12161f;--surface-2:#191f2a;--surface-3:#1f2734;
  --border:#252d3b;--border-soft:#1c2330;
  --text:#e9edf5;--text-dim:#8892a6;--text-faint:#5b6478;
  --accent:#7c5cfc;--accent-soft:#7c5cfc26;
  --mint:#2fe6a6;--mint-soft:#2fe6a624;
  --amber:#ffb454;--amber-soft:#ffb45424;
  --coral:#ff6b6b;--coral-soft:#ff6b6b24;
  --cyan:#3fd0ff;
  --disp:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);color-scheme:dark}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.top{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 60px #00000066}
.auth{width:min(430px,100%);padding:32px}
.brand{text-align:center;margin-bottom:25px}
.brand h1{margin:0;font-family:var(--disp);font-size:29px;font-weight:700;letter-spacing:-.01em}
.brand p{color:var(--text-dim);margin:8px 0 0;font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-2);padding:5px;border-radius:11px;margin-bottom:20px;border:1px solid var(--border-soft)}
.tabs button{padding:11px;border-radius:8px;background:transparent;color:var(--text-dim);font-weight:600}
.tabs .active{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--border) inset}
.field{margin:13px 0}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:9px;outline:0;background:var(--bg-2);color:var(--text)}
.field select option{background:var(--bg-2);color:var(--text)}
.field input::placeholder{color:var(--text-faint)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{width:100%;padding:13px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;margin-top:8px;font-size:14px}
.btn.secondary{background:var(--surface-3);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--coral-soft);color:var(--coral);border:1px solid #ff6b6b3d}
.small{font-size:12px;color:var(--text-faint);margin-top:10px;line-height:1.55}
.hidden{display:none!important}
.app{min-height:100vh;background:var(--bg)}
.nav{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.nav b{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.01em}
.nav-right{display:flex;gap:10px;align-items:center}
.pill{background:var(--mint-soft);color:var(--mint);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;font-family:var(--mono);letter-spacing:.03em}
.layout{display:grid;grid-template-columns:222px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--surface);border-right:1px solid var(--border);padding:16px 10px}
.side button{width:100%;text-align:left;background:transparent;padding:11px 12px;border-radius:9px;margin-bottom:3px;color:var(--text-dim);font-weight:600;font-size:14px;border-left:2px solid transparent}
.side button:hover{background:var(--surface-2);color:var(--text)}
.side button.active{background:var(--accent-soft);color:#b9a8ff;border-left:2px solid var(--accent)}
.main{padding:26px;max-width:1250px;width:100%;margin:auto}
.main h1{font-family:var(--disp);font-weight:600;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px;border-left:3px solid var(--border)}
.stat span{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat strong{display:block;font-family:var(--mono);font-size:25px;margin-top:8px;font-weight:600;letter-spacing:-.01em}
</style>
</head>
<style>
.content{margin-top:18px}
.panel{padding:20px}
.panel h2,.panel h3{margin-top:0;font-family:var(--disp);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ref{background:linear-gradient(135deg,#241a4a,#150f30 60%);border:1px solid #382a70;color:#fff;padding:22px;border-radius:14px}
.ref h3{font-family:var(--disp)}
.ref code{display:block;background:#00000040;padding:11px;border-radius:8px;margin:10px 0;overflow:auto;font-family:var(--mono);font-size:12.5px;color:#c9bfff;border:1px solid #ffffff14}
.ref button{background:var(--mint);color:#06251b;padding:10px 14px;border-radius:8px;font-weight:700}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--border-soft);font-size:13px;white-space:nowrap}
.table th{color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.table td{color:var(--text)}
.badge{display:inline-block;padding:5px 9px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--text-dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.03em}
.badge.green{background:var(--mint-soft);color:var(--mint)}
.badge.orange{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--coral-soft);color:var(--coral)}
.chat{height:470px;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;background:var(--bg-2);border-radius:12px;padding:15px;border:1px solid var(--border-soft)}
.msg{max-width:82%;padding:10px 12px;border-radius:11px;margin:7px 0;font-size:13px;line-height:1.5}
.bot{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
.me{background:var(--accent);color:#fff;margin-left:auto}
.chatbar{display:flex;gap:8px;margin-top:10px}
.chatbar input{flex:1;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--bg-2);color:var(--text)}
.chatbar button{padding:0 18px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700}
.modal{position:fixed;inset:0;background:#000000a6;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{width:min(500px,100%);padding:24px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:12px 15px;border-radius:10px;display:none;z-index:30;font-size:13px}
.demo-ticker{position:relative;height:34px;overflow:hidden;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;align-items:center}
.demo-ticker-text{width:100%;text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--mint);letter-spacing:.02em;animation:fadeIn .4s ease}
.demo-dot{position:absolute;top:8px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px var(--mint-soft);cursor:default}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.video-card{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;overflow:hidden}
.video-embed{position:relative;width:100%;padding-top:56.25%;background:#000}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-info{padding:12px 14px}
.video-info h4{margin:0 0 6px;font-family:var(--disp);font-size:15px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}.side button{min-width:max-content}.grid{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.main{padding:15px}.nav{padding:0 14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.auth{padding:22px}}

/* Animations */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-25px) scale(1.08)}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes pulseSoft{0%,100%{box-shadow:0 0 0 0 #7c5cfc4a}50%{box-shadow:0 0 0 8px #7c5cfc00}}
@keyframes driftDots{0%{background-position:0 0,0 0}100%{background-position:120px 80px,-80px 60px}}

.top{position:relative;overflow:hidden;background:radial-gradient(circle at 18% 22%,#7c5cfc22,transparent 40%),radial-gradient(circle at 82% 78%,#2fe6a61c,transparent 42%),var(--bg)}
.top::before{content:"";position:absolute;inset:-10%;z-index:0;opacity:.55;background-image:radial-gradient(#7c5cfc55 1.4px,transparent 1.6px),radial-gradient(#2fe6a640 1.4px,transparent 1.6px);background-size:46px 46px,46px 46px;background-position:0 0,23px 23px;animation:driftDots 14s linear infinite;mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 60%,transparent 100%)}
.top::after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(80px);opacity:.3;z-index:0;background:var(--accent);top:-110px;right:-110px;animation:floatBlob 10s ease-in-out infinite}
.auth{position:relative;z-index:1;animation:popIn .45s cubic-bezier(.2,.8,.3,1) both}
.brand h1{background:linear-gradient(90deg,#7c5cfc,#3fd0ff,#7c5cfc);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
.hero-headline{text-align:center;max-width:520px;margin:0 auto 20px;font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.25;letter-spacing:-.01em;background:linear-gradient(90deg,#7c5cfc,#3fd0ff,#7c5cfc);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
</style>
</head>
<body>

<div id="auth" class="top">
  <div style="width:min(430px,100%)">
    <h1 class="hero-headline">Start Earning at Home Without Investment</h1>
    <div class="card auth">
    <div class="brand"><h1>🌐 WebTeam</h1><p>Professional Website Development Team</p></div>
    <div class="tabs">
      <button id="memberTab" class="active" onclick="showAuth('member')">👤 Member</button>
      <button id="adminTab" onclick="showAuth('admin')">👑 Admin</button>
    </div>
    <div id="memberAuth">
      <div id="loginBox">
        <div class="field"><label>Email or WhatsApp</label><input id="loginId" placeholder="example@email.com"></div>
        <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••"></div>
        <button class="btn" onclick="loginMember()">Login</button>
        <button class="btn secondary" onclick="toggleRegister()">Create Member Account</button>
      </div>

      <div id="registerBox" class="hidden">
        <div class="field"><label>Full Name</label><input id="regName" placeholder="Your name"></div>
        <div class="field"><label>Email</label><input id="regEmail" type="email" placeholder="you@example.com"></div>
        <div class="field"><label>WhatsApp Number</label><input id="regPhone" placeholder="03xxxxxxxxx"></div>
        <div class="field"><label>Password</label><input id="regPass" type="password" placeholder="Create password"></div>
        <div class="field"><label>Referral Code (optional)</label><input id="regRef" placeholder="e.g. AHM123"></div>
        <button class="btn" onclick="registerMember()">Create Account</button>
        <button class="btn secondary" onclick="toggleRegister()">Back to Login</button>
      </div>
    </div>

    <div id="adminAuth" class="hidden">
      <div class="field"><label>Admin Code</label><input id="adminCode" type="password" placeholder="Enter private admin code"></div>
      <button class="btn" onclick="loginAdmin()">Open Admin Panel</button>
    </div>
  </div>
  </div>
</div>

<div id="memberApp" class="app hidden">
  <div class="demo-ticker"><span id="demoTickerText" class="demo-ticker-text"></span><span class="demo-dot"></span></div>
  <div class="nav"><b>🌐 WebTeam</b><div class="nav-right"><span id="memberNamePill" class="pill"></span><button class="btn danger" style="width:auto;margin:0;padding:8px 12px" onclick="logout()">Logout</button></div></div>
  <div class="layout">
    <aside class="side">
      <button class="active" onclick="memberPage('home',this)">🏠 Dashboard</button>
      <button onclick="memberPage('clients',this)">👤 My Clients</button>
      <button onclick="memberPage('earnings',this)">💰 My Earnings</button>
      <button onclick="memberPage('referrals',this)">👥 My Referrals</button>
      <button onclick="memberPage('bot',this)">🤖 My Bot</button>
    </aside>
    <main id="memberMain" class="main"></main>
  </div>
</div>

<div id="adminApp" class="app hidden">
  <div class="nav"><b>🌐 WebTeam Admin</b><div class="nav-right"><div class="notif-wrap"><button id="notifBtn" class="icon-btn" onclick="toggleNotifPanel()">🔔<span id="notifBadge" class="notif-badge hidden">0</span></button><div id="notifPanel" class="notif-panel hidden"></div></div><span id="adminPill" class="pill">ADMIN</span><button class="btn danger" style="width:auto;margin:0;padding:8px 12px" onclick="logout()">Logout</button></div></div>
  <div class="layout">
    <aside class="side">
      <button class="active" onclick="adminPage('home',this)">🏠 Dashboard</button>
      <button onclick="adminPage('members',this)">👥 Members</button>
      <button onclick="adminPage('clients',this)">👤 Clients</button>
      <button onclick="adminPage('payments',this)">💳 Payments</button>
      <button onclick="adminPage('commissions',this)">💰 Commissions</button>
      <button onclick="adminPage('videos',this)">🎥 Guide Videos</button>
      <button id="adminBotBtn" onclick="adminPage('bot',this)">🤖 Admin Bot</button>
    </aside>
    <main id="adminMain" class="main"></main>
  </div>
</div>
<div id="modal" class="modal hidden"><div class="card" id="modalBody"></div></div>
<div id="toast" class="toast"></div>

<!-- FIREBASE SDKs INTEGRATED WITH YOUR KEYS -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDocs, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD1OYfIUxgHPsdNcy7UwJn-sNMA-EnMnCA",
    authDomain: "absa-developers.firebaseapp.com",
    projectId: "absa-developers",
    storageBucket: "absa-developers.firebasestorage.app",
    messagingSenderId: "559575822664",
    appId: "1:559575822664:web:8b845785b2a0eed000437d",
    measurementId: "G-WWQPLGHGCE"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  setPersistence(auth, browserLocalPersistence);

  const ADMIN_CODE = "Rana9053$";
  const VIEWER_CODE = "1947";
  let state = { members: [], clients: [], payments: [], commissions: [], videos: [], notifications: [] };
  let current = null, role = null;

  // Realtime Firestore Sync
  onSnapshot(collection(db, "members"), (snap) => {
    state.members = snap.docs.map(d => ({id: d.id, ...d.data()}));
    refreshUI();
  });
  onSnapshot(collection(db, "clients"), (snap) => {
    state.clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
    refreshUI();
  });
  onSnapshot(collection(db, "payments"), (snap) => {
    state.payments = snap.docs.map(d => ({id: d.id, ...d.data()}));
    refreshUI();
  });
  onSnapshot(collection(db, "commissions"), (snap) => {
    state.commissions = snap.docs.map(d => ({id: d.id, ...d.data()}));
    refreshUI();
  });
  onSnapshot(collection(db, "videos"), (snap) => {
    state.videos = snap.docs.map(d => ({id: d.id, ...d.data()}));
    refreshUI();
  });

  // PERSISTENT AUTH
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const memberDoc = state.members.find(m => m.email === user.email || m.id === user.uid);
      if(memberDoc) {
        current = memberDoc;
        role = "member";
        openMember();
      }
    } else if (role === "member") {
      logout();
    }
  });

  function refreshUI() {
    if(role === "member") {
      const activeBtn = document.querySelector("#memberApp .side button.active");
      const currentPage = activeBtn ? activeBtn.getAttribute("onclick").split("'")[1] : "home";
      memberPage(currentPage);
    }
    if(role === "admin" || role === "viewer") {
      const activeBtn = document.querySelector("#adminApp .side button.active");
      const currentPage = activeBtn ? activeBtn.getAttribute("onclick").split("'")[1] : "home";
      adminPage(currentPage);
    }
  }

  // Auth Operations
  window.registerMember = async () => {
    const name = regName.value.trim(), email = regEmail.value.trim().toLowerCase(), phone = regPhone.value.trim(), pass = regPass.value, ref = regRef.value.trim().toUpperCase();
    if(!name||!email||!phone||!pass) return toast("Please fill all fields");

    try {
      const res = await createUserWithEmailAndPassword(auth, email, pass);
      let referrer = state.members.find(m => m.code === ref);
      const m = { id: res.user.uid, name, email, phone, code: referralCode(name), referredBy: referrer ? referrer.id : null, created: new Date().toISOString() };
      
      await setDoc(doc(db, "members", res.user.uid), m);
      current = m; role = "member"; openMember(); toast("Account created successfully!");
    } catch(err) {
      toast(err.message);
    }
  };

  window.loginMember = async () => {
    const v = loginId.value.trim().toLowerCase(), p = loginPass.value;
    try {
      await signInWithEmailAndPassword(auth, v, p);
    } catch(err) {
      toast("Invalid login credentials");
    }
  };

  window.loginAdmin = () => {
    const v = adminCode.value;
    if(v === ADMIN_CODE) { role = "admin"; current = { name: "Administrator" }; openAdmin(); }
    else if(v === VIEWER_CODE) { role = "viewer"; current = { name: "Viewer" }; openAdmin(); }
    else toast("Invalid admin code");
  };

  window.logout = async () => {
    await signOut(auth);
    current = null; role = null;
    document.getElementById("memberApp").classList.add("hidden");
    document.getElementById("adminApp").classList.add("hidden");
    document.getElementById("auth").classList.remove("hidden");
  };

  window.showAuth = (type) => {
    document.getElementById("memberAuth").classList.toggle("hidden", type !== "member");
    document.getElementById("adminAuth").classList.toggle("hidden", type !== "admin");
    document.getElementById("memberTab").classList.toggle("active", type === "member");
    document.getElementById("adminTab").classList.toggle("active", type === "admin");
  };
  
  window.toggleRegister = () => {
    document.getElementById("loginBox").classList.toggle("hidden");
    document.getElementById("registerBox").classList.toggle("hidden");
  };
  function referralCode(name){ return name.replace(/[^a-zA-Z]/g,"").slice(0,3).toUpperCase() + Math.floor(100+Math.random()*900); }
  function toast(t){ let x=document.getElementById("toast"); x.textContent=t; x.style.display="block"; setTimeout(()=>x.style.display="none", 2200); }
  window.closeModal = () => document.getElementById("modal").classList.add("hidden");
  
  function openMember(){ 
    document.getElementById("auth").classList.add("hidden"); 
    document.getElementById("adminApp").classList.add("hidden"); 
    document.getElementById("memberApp").classList.remove("hidden"); 
    memberNamePill.textContent = current.name; 
    memberPage("home"); 
    initTicker();
  }
  
  function openAdmin(){ 
    document.getElementById("auth").classList.add("hidden"); 
    document.getElementById("memberApp").classList.add("hidden"); 
    document.getElementById("adminApp").classList.remove("hidden"); 
    adminPage("home"); 
  }

  // Ticker System
  function initTicker() {
    const msgs = ["🔥 Direct Client Deal = 30% Commission", "🚀 Level 1 Referral = 10% Lifetime Cut", "💎 Fast Payouts Directly to EasyPaisa / JazzCash"];
    let idx = 0;
    setInterval(() => {
      const el = document.getElementById("demoTickerText");
      if(el) { el.textContent = msgs[idx]; idx = (idx + 1) % msgs.length; }
    }, 4000);
  }

  // Member Dashboard Navigation
  window.memberPage = (p, btn) => {
    if(btn) {
      document.querySelectorAll("#memberApp .side button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }
    const m = document.getElementById("memberMain");
    const myClients = state.clients.filter(c => c.memberId === current.id);
    const myComms = state.commissions.filter(c => c.memberId === current.id);
    const totalEarned = myComms.reduce((a, b) => a + Number(b.amount || 0), 0);

    if(p === 'home') {
      m.innerHTML = `
        <h1>Dashboard 👋</h1>
        <div class="grid">
          <div class="card stat"><span>Clients</span><strong>${myClients.length}</strong></div>
          <div class="card stat"><span>Earnings</span><strong>Rs ${totalEarned.toLocaleString()}</strong></div>
          <div class="card stat"><span>Referral Code</span><strong>${current.code}</strong></div>
          <div class="card stat"><span>Status</span><strong style="color:var(--mint)">Active Member</strong></div>
        </div>
        <div class="content two">
          <div class="card panel ref">
            <h3>Your Referral Link</h3>
            <p>Invite others to earn 10% lifetime override on their client deals.</p>
            <code>https://webteam.app/?ref=${current.code}</code>
            <button onclick="navigator.clipboard.writeText('https://webteam.app/?ref=${current.code}');toast('Link Copied!')">Copy Link</button>
          </div>
          <div class="card panel">
            <h3>Quick Actions</h3>
            <button class="btn" onclick="openClientModal()">+ Add New Client</button>
          </div>
        </div>
      `;
    } else if(p === 'clients') {
      let rows = myClients.map(c => `<tr><td>${c.name}</td><td>${c.business || 'N/A'}</td><td>${c.phone}</td><td><span class="badge ${c.status==='deal'?'green':'orange'}">${c.status}</span></td></tr>`).join('');
      m.innerHTML = `
        <h1>My Clients <button class="btn" style="width:auto;float:right;margin:0" onclick="openClientModal()">+ Add Client</button></h1>
        <div class="card panel content table-wrap">
          <table class="table">
            <thead><tr><th>Client Name</th><th>Business</th><th>Phone</th><th>Status</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4">No clients added yet.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    } else if(p === 'earnings') {
      let rows = myComms.map(c => `<tr><td>${c.clientName || 'Commission'}</td><td>Rs ${c.amount}</td><td><span class="badge green">Paid</span></td><td>${c.date ? new Date(c.date).toLocaleDateString() : 'N/A'}</td></tr>`).join('');
      m.innerHTML = `
        <h1>My Earnings</h1>
        <div class="card panel content table-wrap">
          <table class="table">
            <thead><tr><th>Source</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4">No earnings logged yet.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    } else if(p === 'referrals') {
      const refs = state.members.filter(m => m.referredBy === current.id);
      let rows = refs.map(r => `<tr><td>${r.name}</td><td>${r.email}</td><td>${r.phone}</td></tr>`).join('');
      m.innerHTML = `
        <h1>My Team Referrals</h1>
        <div class="card panel content table-wrap">
          <table class="table">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="3">No team members referred yet.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    } else if(p === 'bot') {
      m.innerHTML = `
        <h1>Assistant Bot</h1>
        <div class="card panel content chat">
          <div class="messages" id="chatMsgs"><div class="msg bot">Hello ${current.name}! How can I assist you with your clients or commissions today?</div></div>
          <div class="chatbar">
            <input id="chatIn" placeholder="Type your question..." onkeypress="if(event.key==='Enter') sendBotMsg()">
            <button onclick="sendBotMsg()">Send</button>
          </div>
        </div>
      `;
    }
  };

  // Admin Dashboard Navigation
  window.adminPage = (p, btn) => {
    if(btn) {
      document.querySelectorAll("#adminApp .side button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }
    const m = document.getElementById("adminMain");
    if(p === 'home') {
      m.innerHTML = `
        <h1>Admin Control Panel</h1>
        <div class="grid">
          <div class="card stat"><span>Total Members</span><strong>${state.members.length}</strong></div>
          <div class="card stat"><span>Total Clients</span><strong>${state.clients.length}</strong></div>
          <div class="card stat"><span>Commissions Paid</span><strong>${state.commissions.length}</strong></div>
          <div class="card stat"><span>Guide Videos</span><strong>${state.videos.length}</strong></div>
        </div>
      `;
    } else if(p === 'members') {
      let rows = state.members.map(mb => `<tr><td>${mb.name}</td><td>${mb.email}</td><td>${mb.phone}</td><td><code>${mb.code}</code></td></tr>`).join('');
      m.innerHTML = `
        <h1>All Members</h1>
        <div class="card panel content table-wrap">
          <table class="table">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Code</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4">No registered members found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    } else if(p === 'clients') {
      let rows = state.clients.map(c => `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.business || 'N/A'}</td><td><span class="badge ${c.status==='deal'?'green':'orange'}">${c.status}</span></td></tr>`).join('');
      m.innerHTML = `
        <h1>Client Leads</h1>
        <div class="card panel content table-wrap">
          <table class="table">
            <thead><tr><th>Client</th><th>Phone</th><th>Business</th><th>Status</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4">No client records found.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    } else if(p === 'commissions') {
      let rows = state.commissions.map(c => `<tr><td>${c.memberName || c.memberId}</td><td>Rs ${c.amount}</td><td>${c.type || 'Direct'}</td></tr>`).join('');
      m.innerHTML = `
        <h1>Commissions Log</h1>
        <div class="card panel content table-wrap">
          <table class="table">
            <thead><tr><th>Member</th><th>Amount</th><th>Type</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="3">No commissions recorded.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    } else if(p === 'videos') {
      m.innerHTML = `
        <h1>Guide Videos</h1>
        <div class="card panel content">
          <p>Guide videos management system active.</p>
        </div>
      `;
    } else if(p === 'bot') {
      m.innerHTML = `
        <h1>Admin Control Bot</h1>
        <div class="card panel content chat">
          <div class="messages" id="adminChatMsgs"><div class="msg bot">Admin Bot online. Everything in sync with Firestore!</div></div>
        </div>
      `;
    }
  };

  // Modals & Chat Functions
  window.openClientModal = () => {
    document.getElementById("modalBody").innerHTML = `
      <h3>Add New Client Lead</h3>
      <div class="field"><label>Client Name</label><input id="cName" placeholder="Client Name"></div>
      <div class="field"><label>WhatsApp Number</label><input id="cPhone" placeholder="03xxxxxxxxx"></div>
      <div class="field"><label>Business Category</label><input id="cBiz" placeholder="e.g. Clothing, Real Estate"></div>
      <button class="btn" onclick="saveClient()">Submit Client</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    `;
    document.getElementById("modal").classList.remove("hidden");
  };

  window.saveClient = async () => {
    const name = cName.value.trim(), phone = cPhone.value.trim(), business = cBiz.value.trim();
    if(!name || !phone) return toast("Name and Phone are required");

    const newId = doc(collection(db, "clients")).id;
    const clientData = {
      id: newId,
      memberId: current.id,
      memberName: current.name,
      name, phone, business,
      status: "lead",
      created: new Date().toISOString()
    };

    await setDoc(doc(db, "clients", newId), clientData);
    closeModal();
    toast("Client Added Successfully!");
  };

  window.sendBotMsg = () => {
    const input = document.getElementById("chatIn");
    const txt = input.value.trim();
    if(!txt) return;

    const msgs = document.getElementById("chatMsgs");
    msgs.innerHTML += `<div class="msg me">${txt}</div>`;
    input.value = "";

    setTimeout(() => {
      msgs.innerHTML += `<div class="msg bot">Thanks for reaching out! Our team is reviewing client leads continuously. You get 30% on direct client deals!</div>`;
      msgs.scrollTop = msgs.scrollHeight;
    }, 600);
  };
</script>
</body>
</html>
